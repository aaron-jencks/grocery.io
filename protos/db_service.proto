syntax = "proto3";

package grocery.database;
option java_multiple_files = true;
option java_package = "com.example.grocerystoreorganizer.grpc";
option java_outer_classname = "DbServiceProto";

message UpcRequest {
  string upc = 1;
}

enum ProductUnit {
  option allow_alias = true;
  OZ = 0;
  LB = 1;
  EA = 2;
  ITEM = 2;
  KG = 3;
  G = 4;
  LIT = 5;
  ML = 6;
  GAL = 7;
  QT = 8;
  PT = 9;
  TSP = 10;
  TBSP = 11;
}

enum ComparisonMode {
  CHEAPEST_PRICE = 0;
  BEST_UNIT_VALUE = 1;
}

enum PackagingStyle {
  PACKAGING_UNSPECIFIED = 0;
  LOOSE = 1;
  CAN = 2;
  BOTTLE = 3;
  BOX = 4;
  BAG = 5;
  CARTON = 6;
  BUNCH = 7;
  OTHER = 8;
}

message UpcInfo {
  string upc = 1;
  string productName = 2;
  optional string productCategory = 3;
  string variantLabel = 4;
  int32 packCount = 5;
  double netQuantity = 6;
  ProductUnit quantityUnit = 7;
  bool isVariableWeight = 8;
  string updatedAt = 9;
  optional string brand = 10;
  optional string flavor = 11;
  optional PackagingStyle packagingStyle = 12;
}

message UpcResponse {
  bool found = 1;
  optional UpcInfo info = 2;
}

service UpcService {
  rpc ResolveUpc(UpcRequest) returns (UpcResponse);
}

message ProductInfo {
  uint32 productId = 1;
  string productName = 2;
  optional string productCategory = 3;
  string updatedAt = 4;
}

message ListProductsRequest {
  optional string updatedAfter = 1;
}

message ListProductsResponse {
  repeated ProductInfo products = 1;
  string nextSyncToken = 2;
}

message ListVariantsForProductRequest {
  string productName = 1;
  optional string updatedAfter = 2;
}

message ListVariantsForProductResponse {
  repeated UpcInfo variants = 1;
  string nextSyncToken = 2;
}

service CatalogService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc ListVariantsForProduct(ListVariantsForProductRequest) returns (ListVariantsForProductResponse);
}

message Coordinate {
  double latitude = 1;
  double longitude = 2;
}

message StoreInfo {
  string storeAddress = 1;
  Coordinate location = 2;
  optional string storeName = 3;
}

message SaleInfo {
  string startDate = 1;
  optional string expirationDate = 2;
  optional int32 minimumQuantity = 3;
  optional int32 limitQuantity = 4;
}

message PriceObservationRequest {
  StoreInfo store = 1;
  UpcInfo upc = 2;
  double priceTotal = 3;
  string observedAt = 4;
  bool isSale = 5;
  optional SaleInfo saleInfo = 6;
  optional bytes trainingImageJpeg = 7;
  optional string trainingImageFilename = 8;
  optional bool trainingImageUpcPresent = 9;
}

message PriceObservationResponse {
  optional uint32 observationId = 1;
}

service ObservationService {
  rpc CreatePriceObservation(PriceObservationRequest) returns (PriceObservationResponse);
}

message ParsePriceTagImageRequest {
  bytes imageJpeg = 1;
  optional string imageFilename = 2;
}

message ParsePriceTagImageResponse {
  bool ambiguous = 1;
  bool unparsable = 2;
  bool upcParsable = 3;
  optional string upc = 4;
  optional double priceTotal = 5;
  optional int32 packCount = 6;
  optional double netQuantity = 7;
  optional ProductUnit quantityUnit = 8;
  bool isVariableWeight = 9;
  optional string message = 10;
}

service ParsingService {
  rpc ParsePriceTagImage(ParsePriceTagImageRequest) returns (ParsePriceTagImageResponse);
}

message GroceryListOptimizationItem {
  int32 itemId = 1;
  string productName = 2;
  int32 desiredCount = 3;
  ComparisonMode comparisonMode = 4;
  optional string preferredUpc = 5;
}

message OptimizeGroceryListRequest {
  repeated GroceryListOptimizationItem items = 1;
}

message OptimizedStore {
  uint32 storeId = 1;
  optional string storeName = 2;
  string storeAddress = 3;
  Coordinate location = 4;
}

message OptimizedVariant {
  string upc = 1;
  string productName = 2;
  string variantLabel = 3;
  int32 packCount = 4;
  double netQuantity = 5;
  ProductUnit quantityUnit = 6;
  optional string brand = 7;
  optional string flavor = 8;
  optional PackagingStyle packagingStyle = 9;
}

message OptimizedItemMatch {
  int32 itemId = 1;
  ComparisonMode comparisonMode = 2;
  int32 desiredCount = 3;
  OptimizedStore store = 4;
  OptimizedVariant variant = 5;
  uint32 priceObservationId = 6;
  double observedPriceTotal = 7;
  string observedAt = 8;
  double estimatedTotalPrice = 9;
}

message UnmatchedOptimizationItem {
  int32 itemId = 1;
  string productName = 2;
  string reason = 3;
}

message OptimizeGroceryListResponse {
  repeated OptimizedItemMatch matches = 1;
  repeated UnmatchedOptimizationItem unmatched = 2;
}

service ShoppingService {
  rpc OptimizeGroceryList(OptimizeGroceryListRequest) returns (OptimizeGroceryListResponse);
}
